name: Build Android APK from Web App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Create Capacitor JSON Config
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.monaph.matchsniper",
            "appName": "MatchSniper",
            "webDir": "dist"
          }
          EOF

      - name: Add Android Platform & Sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatchSniper-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
